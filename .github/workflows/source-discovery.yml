name: Project source discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "31 14 * * 2"

permissions:
  contents: write
  issues: write

concurrency:
  group: project-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trusted CA bundle
        run: python -m pip install --disable-pip-version-check certifi

      - name: Discover candidates from registered official sources
        id: discovery
        run: SSL_CERT_FILE="$(python -m certifi)" python scripts/discover_sources_v2.py

      - name: Commit discovery queue when it changes
        run: |
          if git diff --quiet -- public/data/discovery-queue.json; then
            echo "No discovery-queue change to commit."
            exit 0
          fi
          git config user.name "cf-investing-source-discovery"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/discovery-queue.json
          git commit -m "Update project discovery review queue"
          git push

      - name: Create review issue for newly discovered candidates
        if: steps.discovery.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Project discovery review queue — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/source-discovery-review.md
